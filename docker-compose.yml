services:
  # Preview em desenvolvimento (hot reload)
  # Uso: docker compose up web
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file: .env
    environment:
      - WATCHPACK_POLLING=true
    # Permite alcançar o banco através do host (túnel SSH em dev).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Produção atrás do nginx do sistema.
  # Publica só em 127.0.0.1, então não é acessível pela internet:
  # todo acesso externo passa obrigatoriamente pelo nginx, que termina o TLS.
  # Uso: docker compose --profile prod up -d --build web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:3002:3000"
    env_file: .env
    environment:
      # Só é seguro porque o nginx sobrescreve X-Forwarded-For.
      - TRUST_PROXY=true
      # Docker define HOSTNAME=id do container; o Next passa a escutar só nele
      # e a porta publicada no host recebe empty reply. Forçar 0.0.0.0.
      - HOSTNAME=0.0.0.0
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  node_modules:
