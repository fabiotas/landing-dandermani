services:
  # Preview em desenvolvimento (hot reload)
  # Uso: docker compose up web
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file: .env
    environment:
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Produção atrás do nginx do sistema (127.0.0.1:3002).
  # Uso: docker compose --profile prod up -d --build web-prod
  # HOSTNAME=0.0.0.0: o Next precisa escutar em todas as interfaces
  # para a porta publicada no host funcionar.
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:3002:3000"
    env_file: .env
    environment:
      - TRUST_PROXY=true
      - HOSTNAME=0.0.0.0
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  node_modules:
