# Server block para o nginx do sistema, na VPS.
#
# Instalação:
#   cp nginx/landing.conf /etc/nginx/sites-available/landing-estetica
#   # substitua SEU_DOMINIO
#   ln -s /etc/nginx/sites-available/landing-estetica /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Em seguida emita o certificado, que adiciona o bloco 443 e o redirect:
#   certbot --nginx -d SEU_DOMINIO
#
# Nunca use `systemctl restart nginx` nesta VPS: outros sites dependem dele.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # O formulário envia poucos bytes; corta upload abusivo na borda.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Sobrescreve em vez de anexar: impede o cliente de forjar a origem e
        # burlar o rate limit por IP da API. É o que autoriza TRUST_PROXY=true.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Depois do Certbot, acrescente esta linha ao server block de 443 que ele criou:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Não coloque HSTS no bloco 80: navegadores ignoram o cabeçalho sem TLS.
