# Reverse proxy com TLS na frente do Next.
# Substitua SEU_DOMINIO e emita o certificado antes de subir (ver README).

upstream app {
  server web-prod:3000;
}

server {
  listen 80;
  server_name SEU_DOMINIO;

  # Validação do Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name SEU_DOMINIO;

  ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # O formulário envia poucos bytes; corta upload abusivo na borda.
  client_max_body_size 64k;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # Sobrescreve em vez de anexar: assim o cliente não consegue forjar a
    # origem e burlar o rate limit por IP da API.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
